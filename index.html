<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      body {
        background-color: rgb(30, 63, 71);
        margin: 0;
        padding: 16px;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      #topbar {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }

      #topbar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      #status {
        min-width: 6em;
        color: rgba(255, 255, 255, 0.78);
      }

      #play {
        padding: 8px 24px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background-color: rgb(30, 140, 160);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      #play:hover {
        background-color: rgb(40, 170, 195);
      }

      #play:active {
        transform: scale(0.97);
      }

      #play:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #grid {
        font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        font-size: 14px;
        background: #0e2730;
        padding: 8px 16px;
        border-radius: 8px;
        user-select: none;
        outline: none;
      }

      #grid:focus {
        box-shadow: 0 0 0 2px rgba(40, 170, 195, 0.6);
      }

      .row {
        display: flex;
        align-items: center;
        line-height: 1.5em;
        white-space: pre;
      }

      .row.playhead {
        background: rgba(255, 255, 255, 0.06);
      }

      .row.playhead-playing {
        background: rgba(255, 200, 80, 0.15);
      }

      .row-number {
        color: #6da6b3;
        width: 2.5em;
        text-align: right;
        margin-right: 12px;
      }

      .channel-sep {
        color: #355560;
      }

      .sub.cursor {
        background: rgb(200, 60, 60);
        color: #fff;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <button id="play">Play</button>
      <span id="status">Stopped</span>
      <label>Instrument: <select id="instrument-select"></select></label>
      <label>Octave: <span id="octave">4</span> <small>(+/-)</small></label>
      <label><input type="checkbox" id="start-from-cursor" /> Start from cursor</label>
    </div>
    <div id="grid" tabindex="0"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
