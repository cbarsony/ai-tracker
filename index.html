<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      #play {
        margin-bottom: 8px;
        font-size: 1.1rem;
        padding: 8px 22px;
        border-radius: 7px;
      }

      #grid {
        font-family: monospace;
        background: #eee;
        border-spacing: 4px;
      }

      #grid tr.empty {
        color: transparent;
      }

      #grid tr {
        height: 1.5em;
      }

      .instrument_character_1,
      .effect_key {
        margin-left: 4px;
      }

      .playhead {
        background: #000;
        color: #fff;
      }

      .cursor {
        background: #eee;
        color: #000;
      }
    </style>
  </head>
  <body>
    <button id="play" class="energy">Play</button>
    <table id="grid" class="energy" tabindex="0"></table>
    <script type="module" src="main.js"></script>
  </body>
</html>
