<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      #play,
      #record {
        font-size: 1.1rem;
        padding: 8px 22px;
        border-radius: 7px;
      }

      #toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      #record.recording {
        color: #c00;
      }

      #grid {
        font-family: monospace;
        background: #eee;
        border-spacing: 4px;
      }

      #grid tr.empty {
        color: transparent;
      }

      #grid tr {
        height: 1.5em;
      }

      .instrument_character_1,
      .effect_key {
        margin-left: 4px;
      }

      .playhead {
        background: #000;
        color: #fff;
      }

      .cursor {
        background: #eee;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="play" class="energy">Play</button>
      <button id="record">Jam</button>
      <label>Instrument <select id="instrument"></select></label>
      <label>Octave <select id="octave"></select></label>
      <input id="song-name" type="text" placeholder="Untitled" spellcheck="false">
      <button id="save">Save</button>
      <button id="load">Load</button>
    </div>
    <input id="file-input" type="file" accept=".txt" style="display:none">
    <table id="grid" class="energy" tabindex="0"></table>
    <script type="module" src="main.js"></script>
  </body>
</html>
