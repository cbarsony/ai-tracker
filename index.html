<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      body {
        background-color: rgb(30, 63, 71);
        display: flex;
        flex-direction: column;
        gap: 16px;
        justify-content: flex-start;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
        color: rgba(255, 255, 255, 0.85);
        font-family: sans-serif;
      }

      #play {
        padding: 16px 40px;
        font-size: 1.2rem;
        font-family: sans-serif;
        font-weight: 600;
        color: #fff;
        background-color: rgb(30, 140, 160);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition:
          background-color 0.2s,
          transform 0.1s,
          box-shadow 0.2s;
      }

      #play:hover {
        background-color: rgb(40, 170, 195);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }

      #play:active {
        transform: scale(0.97);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #play:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.2em;
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font-family: sans-serif;
      }

      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
      }

      #toolbar .toolbar-button,
      #toolbar select {
        background: rgb(40, 90, 100);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 4px 10px;
        font-family: inherit;
        cursor: pointer;
      }

      #toolbar .toolbar-button:hover {
        background: rgb(50, 110, 125);
      }

      #grid {
        outline: none;
        max-width: 100%;
        overflow: auto;
      }

      #grid:focus {
        box-shadow: 0 0 0 2px rgba(80, 200, 220, 0.6);
        border-radius: 4px;
      }

      .tracker-grid {
        border-collapse: collapse;
        font-family: "Cascadia Mono", "Consolas", "Menlo", monospace;
        font-size: 0.95rem;
        background: rgb(20, 40, 46);
        color: rgb(220, 240, 245);
      }

      .tracker-grid th,
      .tracker-grid td {
        padding: 4px 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        white-space: pre;
      }

      .tracker-grid th {
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.65);
        font-weight: 600;
      }

      .tracker-grid td.cell.empty {
        color: rgba(255, 255, 255, 0.35);
      }

      .tracker-grid td.cell.cursor {
        background: rgb(40, 130, 150);
        color: #fff;
        outline: 1px solid rgb(120, 220, 240);
      }

      .tracker-grid tr.playing td,
      .tracker-grid tr.playing th {
        background: rgba(255, 200, 80, 0.18);
      }

      .tracker-grid tr.playing td.cell.cursor {
        background: rgb(60, 150, 170);
      }

      .help {
        max-width: 720px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
      }

      .sample-editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
      }

      .sample-editor-header {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 0.9rem;
      }

      .sample-editor-header select {
        background: rgb(40, 90, 100);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 2px 6px;
        font-family: inherit;
      }

      .sample-editor-loop {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 8px;
        cursor: pointer;
      }

      .sample-canvas {
        display: block;
        max-width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        background: rgb(15, 30, 36);
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 16px; align-items: center;">
      <button id="play">Play</button>
      <p id="status">Stopped</p>
    </div>
    <div id="toolbar"></div>
    <div id="grid"></div>
    <div id="sample-editor"></div>
    <p class="help">
      Click a cell or use arrow keys to move. Bottom keyboard row (Z S X D C V…) plays notes
      in the current octave; <kbd>[</kbd>/<kbd>]</kbd> change octave. Digits select the current
      instrument and overwrite the selected cell's instrument. <kbd>`</kbd> sets note-off,
      <kbd>Delete</kbd> clears.
    </p>
    <script type="module" src="main.js"></script>
  </body>
</html>
