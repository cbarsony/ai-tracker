<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      #play {
        margin-bottom: 8px;
        font-size: 1.1rem;
        padding: 8px 22px;
        border-radius: 7px;
      }

      #grid {
        font-family: monospace;
        background: #eee;
      }

      #grid tr {
        height: 1.5em;
      }

      .energy {
        outline: none;
        transition: box-shadow 0.25s ease;
      }

      .energy:focus {
        box-shadow: 0 0 0 1px #888;
        animation: focus-flash 0.4s ease-out;
      }

      @keyframes focus-flash {
        from {
          outline: 3px solid #00b3ff;
          outline-offset: 1px;
        }
        to {
          outline: 3px solid transparent;
          outline-offset: 1px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .energy {
          transition: none;
        }
        .energy:focus {
          animation: none;
        }
      }

      .playhead {
        background: #000;
        color: #fff;
      }

      .cursor {
        background: #eee;
        color: #000;
      }
    </style>
  </head>
  <body>
    <button id="play" class="energy">Play</button>
    <table id="grid" class="energy" tabindex="0"></table>
    <script type="module" src="main.js"></script>
  </body>
</html>
