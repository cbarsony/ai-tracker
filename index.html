<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      #play {
        margin-bottom: 8px;
        font-size: 1.1rem;
        padding: 8px 22px;
        border-radius: 7px;
      }

      #grid {
        font-family: monospace;
        background: #eee;
        border-spacing: 4px;
      }

      #grid tr {
        height: 1.5em;
      }

      .energy {
        outline: none;
        transition: box-shadow 0.25s ease;
      }

      .energy:focus {
        box-shadow: 0 0 0 1px #888;
        animation: focus-flash 0.4s ease-out;
      }

      @keyframes focus-flash {
        from {
          outline: 3px solid #00b3ff;
          outline-offset: 1px;
        }
        to {
          outline: 3px solid transparent;
          outline-offset: 1px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .energy {
          transition: none;
        }
        .energy:focus {
          animation: none;
        }
      }

      .instrument_character_1,
      .effect_key {
        margin-left: 4px;
      }

      .playhead {
        background: #000;
        color: #fff;
      }

      .cursor {
        background: #eee;
        color: #000;
      }

      .write-cursor {
        background: #d23c3c;
        color: #fff;
      }

      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      #toolbar label {
        font-family: sans-serif;
        font-size: 0.9rem;
      }

      #toolbar input[type="number"] {
        width: 3.5em;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="play" class="energy">Play</button>
      <label>Instrument <select id="instrument" class="energy"></select></label>
      <label>Octave <input id="octave" class="energy" type="number" min="0" max="7" value="4" /></label>
      <label>Step <input id="step" class="energy" type="number" min="0" max="8" value="1" /></label>
    </div>
    <table id="grid" class="energy" tabindex="0"></table>
    <script type="module" src="main.js"></script>
  </body>
</html>
