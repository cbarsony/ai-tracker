<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI Tracker</title>
    <style>
      /* Registered custom property so the conic-gradient angle can be animated.
         (Frontier CSS: only animatable because it is typed as <angle>.) */
      @property --ring-sweep {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      #play {
        margin-bottom: 8px;
        font-size: 1.1rem;
        padding: 8px 22px;
        border-radius: 7px;
      }

      #grid {
        font-family: monospace;
        background: #eee;
      }

      #grid tr {
        height: 1.5em;
      }

      /* Any element that can hold the rainbow energy. */
      .energy {
        position: relative;
        outline: none;
      }

      /* The rainbow ring. Masked so only the border band shows. */
      .energy::after {
        content: "";
        position: absolute;
        inset: -3px;
        z-index: -1;
        border-radius: 10px;
        padding: 3px;
        background: conic-gradient(
          from var(--ring-sweep),
          #ff0066,
          #ffae00,
          #00ffa3,
          #00b3ff,
          #d400ff,
          #ff0066
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0;
        pointer-events: none;
      }

      /* Energy arrives: the ring pulses to life and settles into a steady glow. */
      .energy.receive::after {
        animation: ring-receive 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Energy leaves: the ring is pulled away to nothing. */
      .energy.release::after {
        animation: ring-release 0.3s ease-in forwards;
      }

      @keyframes ring-receive {
        0% {
          --ring-sweep: 0deg;
          opacity: 0;
          transform: scale(1.18);
          filter: blur(8px) brightness(2) saturate(1.6);
        }
        45% {
          opacity: 1;
          transform: scale(0.97);
          filter: blur(0) brightness(1.5) saturate(1.4);
        }
        100% {
          --ring-sweep: 360deg;
          opacity: 1;
          transform: scale(1);
          filter: blur(0) brightness(1) saturate(1);
        }
      }

      @keyframes ring-release {
        0% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0) brightness(1.4) saturate(1.4);
        }
        100% {
          opacity: 0;
          transform: scale(0.82);
          filter: blur(6px) brightness(2) saturate(1.6);
        }
      }

      /* Good taste: respect users who ask for less motion. */
      @media (prefers-reduced-motion: reduce) {
        .energy.receive::after,
        .energy.release::after {
          animation: none;
        }
      }

      .playhead {
        background: #000;
        color: #fff;
      }

      .cursor {
        background: #eee;
        color: #000;
      }
    </style>
  </head>
  <body>
    <button id="play" class="energy">Play</button>
    <table id="grid" class="energy" tabindex="0"></table>
    <script type="module" src="main.js"></script>
  </body>
</html>
